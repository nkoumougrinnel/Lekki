services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lekki-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/wiki.db
      SYNC_DATABASE_URL: sqlite:///./data/wiki.db
      EMBEDDING_PROVIDER_ORDER: gemini
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
